<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Tech Style -->
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>
  </defs>
  
  <!-- Icon - Abstract O & C combined with building elements -->
  <g transform="translate(12, 12)">
    <!-- Outer Circle (O) -->
    <circle cx="20" cy="20" r="18" stroke="url(#techGradient)" stroke-width="3" fill="none"/>
    
    <!-- Inner Building Shape (C) -->
    <rect x="12" y="12" width="16" height="16" rx="2" fill="url(#techGradient)" fill-opacity="0.2"/>
    <rect x="15" y="15" width="4" height="4" rx="1" fill="url(#techGradient)"/>
    <rect x="21" y="15" width="4" height="4" rx="1" fill="url(#techGradient)"/>
    <rect x="15" y="21" width="4" height="4" rx="1" fill="url(#techGradient)"/>
    <rect x="21" y="21" width="4" height="4" rx="1" fill="url(#techGradient)"/>
    
    <!-- Connection Dot -->
    <circle cx="32" cy="20" r="4" fill="#00CCFF"/>
    <circle cx="28" cy="28" r="3" fill="#0066FF" fill-opacity="0.6"/>
  </g>
  
  <!-- Clean Typography -->
  <g transform="translate(55, 22)">
    <text x="0" y="0" font-family="Montserrat, Segoe UI, sans-serif" font-size="24" font-weight="300" fill="#333333">OFFICE</text>
    <text x="80" y="0" font-family="Montserrat, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="url(#techGradient)">CONNECT</text>
  </g>
  
  <!-- Dot Accent -->
  <circle cx="160" cy="30" r="2" fill="#00CCFF"/>
</svg>