<app-toast-message></app-toast-message>

<div class="dis-fl-end">
  <div class="heading-dash-sub">
    <span>Module List</span>
    <ol class="breadcrumb fade-left">
      <li class="breadcrumb-item active dis-fl" aria-current="page">
        <span class="breadC">Access Policy</span><span class="breadC"><i
            class="feather icon-chevron-right"></i></span><span class="breadC col-act">Module List</span>
      </li>
    </ol>
  </div>
  <div class="text-end">
    <div class="top-nav d-flex gap-2">
      <button *ngFor="let tab of tabs; let i = index" class="nav-btn" [class.active]="selectedTab === i"
        (click)="selectTab(i)" [routerLink]="tab.url">
        <i [class]="tab.icon"></i> {{ tab.title }}
      </button>
    </div>

    <button class="HRMS_Create_Close text-end mt-2" type="button" (click)="toggleButton()"
      *ngIf="controlAccessPage?.AddAccess === true">
      <i class="feather" [ngClass]="isCardOpen ? 'icon-x' : 'icon-plus'"></i>&nbsp;
      {{ isCardOpen ? 'Close' : 'Create' }}
    </button>
  </div>
</div>
<app-card [options]="false" *ngIf="isCardOpen">
  <div class="col-md-12">
    <div class="col-md-6 mb-3">
      <h5 class="mb-0 form-heading">Add Module</h5>
    </div>
    <form [formGroup]="moduleForm">
      <div class="row">
        <div class="form-group floating-label-group col-md-3 inputPadding">
          <input type="text" class="form-control floating-input" id="departmentId" placeholder=" "
            formControlName="module_name"
            [ngClass]="{'is-invalid': (isFormSubmitted || moduleForm.get('module_name')?.touched) && moduleForm.get('module_name')?.invalid}">
          <label for="departmentId" class="floating-label" style="left: 20px;"
            [ngClass]="{'text-danger': (isFormSubmitted || moduleForm.get('module_name')?.touched) && moduleForm.get('module_name')?.invalid}">
            Module Name*</label>
          <div
            *ngIf="(isFormSubmitted || moduleForm.get('module_name')?.touched) && moduleForm.get('module_name')?.invalid"
            class="invalid-feedback m-0">
            <span *ngIf="moduleForm?.get('module_name')?.errors?.required">Module Name is required.</span>
            <span *ngIf="moduleForm?.get('module_name')?.errors?.module_name">Invalid Module Name.</span>
            <span
              *ngIf="(moduleForm.get('module_name')?.errors?.minlength || moduleForm.get('module_name')?.errors?.maxlength)">2
              to 50 Charater are allowed.</span>
          </div>
        </div>
      </div>

      <div style="display: flex;justify-content: end;margin-top:4px">
        <button class="HRMS_secondary_button mx-2" type="button" (click)="resetData()"><i
            class="feather icon-rotate-ccw"></i>&nbsp;Reset</button>
        <button class="HRMS_primary_button" type="submit" (click)="submitFormdata()" *ngIf="!isEdited"><i
            class="feather icon-check"></i>&nbsp;Submit</button>
        <button class="HRMS_primary_button" type="submit" (click)="updateModuleForm()" *ngIf="isEdited"><i
            class="feather icon-check"></i>&nbsp;Update</button>
      </div>
    </form>
  </div>
</app-card>

<div class="divSpinner" *ngIf="isSpinner">
  <div class="spinner"></div>
</div>


<app-card [options]="false">
  <div class="col-md-12">
    <div class="row">
      <div class="col-md-9">
        <h5 class="mb-0 form-heading">Available Module</h5>
      </div>
      <div class="col-md-3 text-end">
        <input type="text" class="form-control rad-50" #inputValue (keyup)="applyFilter($event)" placeholder="Search"
          id="serachInputId" />
      </div>
    </div>
  </div>
  <div class="table-wrapper mt-3">
    <table class="table table-hover align-middle">
      <thead class="table-light sticky-header">
        <tr class="inner-shadow">
          <th class="">Module Name</th>
          <th class="text-end me-2"
            *ngIf="(controlAccessPage?.UpdateAccess === true) || (controlAccessPage?.DeleteAccess === true)">Action
          </th>
        </tr>
      </thead>
      <tbody *ngIf="isTableData == false">
        <tr *ngFor="let row of rows | paginate: { itemsPerPage: pageSize, currentPage: page }; let i = index">
          <td class="">
            <span>{{row.ModuleName}}</span>
          </td>
          <td class="text-end" style="cursor: pointer;"
            *ngIf="(controlAccessPage?.UpdateAccess === true) || (controlAccessPage?.DeleteAccess === true)">
            <span class=""> <i class="action-icon action-edit feather icon-edit-2" (click)="editData(row,true)"
                *ngIf="controlAccessPage?.UpdateAccess === true"></i></span>
            <span class=""> <i class="action-icon action-delete feather icon-trash-2 " style="color:#ee3535"
                (click)="onView(row)" data-bs-toggle="modal" data-bs-target="#exampleModal"
                *ngIf="controlAccessPage?.DeleteAccess === true"></i></span>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="isTableData == true" class="text-center errorMassage">
      <span class="text-danger">{{errorMessage}}</span>
    </div>

  </div>
  <div class="pagination-controls-wrapper">
    <div class="row align-items-center">
      <div class="col-auto">
        <label for="pageSizeSelect" style="font-size: smaller;">Records per page:</label>
        <select id="pageSizeSelect" [(ngModel)]="pageSize" class="form-control form-control-sm">
          <option *ngFor="let size of pageSizes" [value]="size">{{ size }}</option>
        </select>
      </div>
      <div class="col">
      </div>
      <div class="col-auto">
        <pagination-controls (pageChange)="page = $event"></pagination-controls>
      </div>
    </div>
  </div>
</app-card>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-confirm">
    <div class="modal-content">
      <div class="text-end">
        <button type="reset" class="btn-close " data-bs-dismiss="modal" aria-label="Close" #closeModal
          style="background-color: rgb(228, 208, 208);"></button>
      </div>
      <div class="modal-header flex-column py-0">
        <div class="icon-box" *ngIf="!isRecordDeleted">
          <i class="fas fa-times checkmark_check"></i>
        </div>
        <div class="modal-wrapper" *ngIf="isRecordDeleted"> <svg class="checkmark" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
            <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
          </svg>
        </div>
        <h4 class="modal-title w-100">Are you sure?</h4>
      </div>
      <div class="modal-body py-0">
        <p>Do you really want to delete these records?This process cannot be undone.</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger" (click)="deleteModuleData()">Delete</button>
      </div>
    </div>
  </div>
</div>
